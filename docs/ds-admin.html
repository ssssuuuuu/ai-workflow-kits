<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design System Console · ds-transform</title>
<style>
  :root{
    --brand:#1F6FEB; --brand-strong:#155CD0;
    --ink:#18202E; --muted:#66707F; --faint:#9AA3AF; --line:#E5E8EC; --page:#EEF1F5; --card:#FFFFFF; --raised:#F7F9FB;
    --ok:#2FB170; --warn:#D99B2E; --danger:#E0143C; --violet:#6D5AE6;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --sb:248px;
  }
  @media (prefers-color-scheme:dark){:root{--ink:#E7ECF4;--muted:#9AA6B6;--faint:#6B7686;--line:#28303C;--page:#0E141C;--card:#161D28;--raised:#1C2530;--brand:#5C97F5;--brand-strong:#7DAEF8;}}
  :root[data-theme="light"]{--ink:#18202E;--muted:#66707F;--faint:#9AA3AF;--line:#E5E8EC;--page:#EEF1F5;--card:#FFFFFF;--raised:#F7F9FB;--brand:#1F6FEB;--brand-strong:#155CD0;}
  :root[data-theme="dark"]{--ink:#E7ECF4;--muted:#9AA6B6;--faint:#6B7686;--line:#28303C;--page:#0E141C;--card:#161D28;--raised:#1C2530;--brand:#5C97F5;--brand-strong:#7DAEF8;}

  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;line-height:1.5;}
  .mono{font-family:var(--mono);}
  a{color:inherit;}

  /* top bar */
  header.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);}
  .top .in{display:flex;align-items:center;gap:14px;padding:11px 20px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;}
  .brand .m{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,var(--brand),var(--brand-strong));color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;}
  .brand small{color:var(--muted);font-weight:600;font-size:12px;}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-width:220px;}
  .search input{border:0;background:transparent;outline:0;color:var(--ink);font:inherit;font-size:13.5px;width:100%;}
  .search svg{width:16px;height:16px;color:var(--muted);flex:none;}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--ink);}
  .tbtn:hover{border-color:var(--brand);}

  .layout{display:grid;grid-template-columns:var(--sb) 1fr;align-items:start;}
  nav.side{position:sticky;top:53px;height:calc(100vh - 53px);border-right:1px solid var(--line);padding:16px 12px;background:var(--card);overflow:auto;}
  nav.side .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 10px 6px;}
  nav.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:9px 10px;border-radius:9px;cursor:pointer;}
  nav.side button .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600;}
  nav.side button:hover{background:var(--raised);}
  nav.side button.on{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);}
  nav.side button.on .ct{color:var(--brand);}
  nav.side svg{width:18px;height:18px;flex:none;}

  main{padding:26px 30px 70px;min-width:0;}
  .page-h{margin-bottom:18px;}
  .page-h h1{font-size:22px;font-weight:800;letter-spacing:-.02em;}
  .page-h p{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:80ch;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600;}

  .loop{display:flex;gap:0;flex-wrap:wrap;margin-top:6px;}
  .lnode{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;position:relative;}
  .lnode + .lnode{margin-left:26px;}
  .lnode + .lnode::before{content:"→";position:absolute;left:-20px;top:50%;transform:translateY(-50%);color:var(--brand);font-weight:800;}
  .lnode .t{font-weight:800;font-size:15px;} .lnode .d{font-size:12px;color:var(--muted);margin-top:4px;}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:border-color .15s,transform .15s;}
  .item:hover{border-color:var(--brand);transform:translateY(-2px);}
  .item .nm{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .lvl{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;}
  .lvl.atom{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);}
  .lvl.molecule{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);}
  .lvl.organism{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet);}
  .item .ds{font-size:12.5px;color:var(--muted);margin-top:7px;min-height:34px;}
  .item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  .tagx{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}

  /* token views */
  .tok-sec{margin-bottom:26px;}
  .tok-sec h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;}
  .tokgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
  .tokrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
  .sw{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);flex:none;}
  .tokrow .tn{font-family:var(--mono);font-size:12px;font-weight:600;}
  .tokrow .tv{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .tokrow .ref{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--brand);text-align:right;}
  .scalerow .bar{height:14px;background:var(--brand);border-radius:3px;}
  .typerow .samp{font-size:0;} /* set inline */

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,15,25,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40;}
  .scrim.on{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(460px,92vw);background:var(--card);border-left:1px solid var(--line);z-index:50;
    transform:translateX(100%);transition:transform .2s ease;overflow:auto;box-shadow:-20px 0 50px -30px rgba(10,15,25,.5);}
  .drawer.on{transform:none;}
  .dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;gap:10px;}
  .dh .x{margin-left:auto;border:0;background:var(--raised);width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:16px;}
  .db{padding:18px 22px 40px;}
  .db h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;}
  .db .desc{color:var(--muted);font-size:13.5px;margin:8px 0 0;}
  .blk{margin-top:20px;}
  .blk .bt{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:9px;}
  .kv{display:flex;flex-direction:column;gap:8px;}
  .slotline{display:flex;align-items:baseline;gap:8px;font-size:13.5px;}
  .slotline .s{font-family:var(--mono);font-weight:700;color:var(--brand);}
  .slotline .a{color:var(--muted);font-size:12.5px;}
  .opt{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;}
  .axis{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
  .axis .an{font-family:var(--mono);font-size:12px;font-weight:700;}
  .vals{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .val{font-family:var(--mono);font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
  .val.def{border-color:var(--brand);color:var(--brand);}
  .pill{font-family:var(--mono);font-size:11px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
  .a11y li{font-size:12.5px;color:var(--muted);margin:4px 0;}
  .empty{color:var(--faint);font-size:13px;padding:40px 0;text-align:center;}

  .iconset{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
  .ico{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 10px 12px;text-align:center;}
  .ico svg{width:26px;height:26px;color:var(--ink);}
  .ico .in{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:9px;}

  .hide{display:none!important;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;}nav.side .grp{display:none;}nav.side button{width:auto;white-space:nowrap;} .stats{grid-template-columns:repeat(2,1fr);} .loop .lnode+.lnode{margin-left:0;margin-top:24px;} .loop .lnode+.lnode::before{left:50%;top:-20px;transform:translateX(-50%) rotate(90deg);}}
</style>

rousel", "atomicLevel": "molecule", "description": "홈 메인의 상품 카드. emphasis로 수치강조형/기능링크형을 통합.", "slots": [{"name": "eyebrow", "accepts": "text"}, {"name": "description", "accepts": "text", "optional": true}, {"name": "metricLabel", "accepts": "text", "optional": true}, {"name": "metricValue", "accepts": "text", "optional": true}, {"name": "featureLinks", "accepts": "TextLink", "optional": true, "repeatable": true}, {"name": "media", "accepts": "Illustration", "optional": true}], "variants": [{"axis": "emphasis", "values": ["metric", "feature"], "default": "metric"}], "states": ["default", "hover", "focus"], "statesRef": "docs/design-system-methodology.md#174-종합-컴포넌트-유형별-문서화-방식-선택-가이드", "tokens": [{"name": "card-background", "references": "color-surface-card"}, {"name": "card-metricValue-color", "references": "color-highlight"}, {"name": "card-radius", "references": "radius-lg"}], "compositionApi": "compound", "children": ["ProductCard.Eyebrow", "ProductCard.Description", "ProductCard.Metric", "ProductCard.FeatureLinks", "ProductCard.Media"], "accessibility": ["Illustration media is decorative and set aria-hidden.", "If the whole card is clickable it exposes a single accessible name; otherwise each featureLink is an independent link."], "consolidates": ["든든 모기지론 카드", "새싹 전세자금대출 카드", "AI 맞춤추천 플랫폼 카드"], "status": "net-new", "docsRef": "packages/ds-transform/examples/finance-portal-home/to-be.example.md"}, {"name": "QuickLink", "family": "QuickLinkBar", "atomicLevel": "molecule", "description": "아이콘 + 라벨의 바로가기 항목.", "slots": [{"name": "icon", "accepts": "Icon"}, {"name": "label", "accepts": "text"}], "variants": [], "states": ["default", "hover", "focus"], "compositionApi": "compound", "accessibility": ["The icon is decorative (aria-hidden); the label provides the link's accessible name."], "consolidates": ["기준금리 조회", "예상대출금액 조회", "대출 진행조회", "간편 서류제출", "대출 계좌조회", "가상계좌 상환", "증명서 발급", "신용회복"], "status": "net-new", "docsRef": "packages/ds-transform/examples/finance-portal-home/to-be.example.md"}, {"name": "SelectField", "atomicLevel": "molecule", "description": "라벨 + Select 컨트롤 + 보조 정보(태그/주소)를 묶은 필드.", "slots": [{"name": "label", "accepts": "text"}, {"name": "value", "accepts": "Select"}, {"name": "tag", "accepts": "Tag", "optional": true}, {"name": "helper", "accepts": "Text", "optional": true}], "variants": [{"axis": "size", "values": ["md", "lg"], "default": "md"}], "states": ["default", "focus", "filled", "disabled", "error"], "compositionApi": "compound", "children": ["Select", "Tag", "Text"], "accessibility": ["label을 Select와 for/id로 연결; helper는 aria-describedby."], "consolidates": ["대출계좌 선택 필드", "담보물 주소 표시"], "status": "net-new", "docsRef": "docs/design-system-methodology.md#1710-input-계열-textfield--textarea--select--switch"}, {"name": "CheckItem", "family": "Checklist", "atomicLevel": "atom", "description": "체크리스트의 한 항목. 체크박스 + 라벨(+ 중첩 보조 설명).", "slots": [{"name": "checkbox", "accepts": "Checkbox"}, {"name": "label", "accepts": "text"}, {"name": "subBullets", "accepts": "Text", "optional": true, "repeatable": true}], "variants": [], "states": ["unchecked", "checked", "disabled"], "accessibility": ["Checkbox와 label을 연결; 중첩 설명은 항목에 종속되게 배치한다."], "consolidates": [], "status": "net-new", "docsRef": "docs/design-system-methodology.md#176-checkbox--radio-아이템-스펙"}, {"name": "DescriptionItem", "family": "DescriptionList", "atomicLevel": "atom", "description": "속성표의 한 라벨-값 쌍.", "slots": [{"name": "label", "accepts": "text"}, {"name": "value", "accepts": "text"}], "variants": [], "states": ["default", "empty"], "accessibility": ["label=<dt>, value=<dd>."], "consolidates": [], "status": "net-new", "docsRef": "docs/design-system-methodology.md#172-detail--속성표description-아이템-스펙"}, {"name": "NavItem", "family": "GlobalHeader", "atomicLevel": "atom", "description": "주 내비게이션의 개별 항목.", "slots": [{"name": "label", "accepts": "text"}], "variants": [{"axis": "state", "values": ["default", "active"], "default": "default"}], "states": ["default", "hover", "focus", "active"], "tokens": [{"name": "navitem-color-active", "references": "color-brand-primary"}], "compositionApi": "props", "accessibility": ["Active item sets aria-current=page."], "consolidates": ["네비 항목"], "status": "net-new", "docsRef": "packages/ds-transform/examples/finance-portal-home/to-be.example.md"}]}</script>
<header class="top"><div class="in">
  <span class="brand"><span class="m">DS</span>Design System Console <small>· ds-transform</small></span>
  <span class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><input id="q" placeholder="원자·컴포넌트 검색"></span>
  <button class="tbtn" id="themeBtn" type="button">◐ theme</button>
</div></header>

<div class="layout">
  <nav class="side" id="nav">
    <div class="grp">Guide</div>
    <button data-v="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</button>
    <div class="grp">Foundations</div>
    <button data-v="tokens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="16" r="4"/></svg>Tokens · 변수 <span class="ct" id="c-tok"></span></button>
    <button data-v="icons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Icons <span class="ct" id="c-ico"></span></button>
    <div class="grp">Catalog</div>
    <button data-v="atoms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)"/></svg>Atoms · 원자 <span class="ct" id="c-atom"></span></button>
    <button data-v="components"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Components <span class="ct" id="c-comp"></span></button>
  </nav>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
(function(){
  var DS = JSON.parse(document.getElementById('DS-DATA').textContent);
  var ICONS = {
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>',
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    check:'<path d="M5 13l4 4L19 7"/>',
    chevron:'<path d="M6 9l6 6 6-6"/>',
    arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/>',
    won:'<circle cx="12" cy="12" r="9"/><path d="M8 9l1.6 6L12 10l2.4 5L16 9M7 12h10"/>',
    doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 13h7M9 16h5"/>',
    card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
    refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>',
    seal:'<circle cx="12" cy="10" r="6"/><path d="M9 15l-1 6 4-2 4 2-1-6"/>',
    heart:'<path d="M12 20s-7-4.6-7-9.5A3.5 3.5 0 0 1 12 8a3.5 3.5 0 0 1 7 2.5C19 15.4 12 20 12 20z"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    back:'<path d="M15 5l-7 7 7 7"/>',
    bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    star:'<path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/>'
  };
  DS.icons = Object.keys(ICONS).map(function(k){return {name:k,path:ICONS[k]};});
  var esc=function(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});};
  var svg=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';};

  // counts
  document.getElementById('c-atom').textContent=DS.atoms.length;
  document.getElementById('c-comp').textContent=DS.components.length;
  document.getElementById('c-ico').textContent=DS.icons.length;
  var tokCount=['reference','semantic','component','space','radius','type'].reduce(function(a,k){return a+(DS.tokens[k]||[]).length;},0);
  document.getElementById('c-tok').textContent=tokCount;

  var main=document.getElementById('main'), q='';
  var byName={}; DS.atoms.concat(DS.components).forEach(function(c){byName[c.name]=c;});

  function itemCard(c){
    return '<div class="item" data-open="'+esc(c.name)+'"><div class="nm">'+esc(c.name)+' <span class="lvl '+c.atomicLevel+'">'+c.atomicLevel+'</span></div>'+
      '<div class="ds">'+esc(c.description||'')+'</div><div class="meta">'+
      (c.slots?'<span class="tagx">slots '+c.slots.length+'</span>':'')+
      (c.variants&&c.variants.length?'<span class="tagx">variants '+c.variants.length+'</span>':'')+
      (c.states&&c.states.length?'<span class="tagx">states '+c.states.length+'</span>':'')+
      '</div></div>';
  }
  function grid(list){
    var f=list.filter(function(c){return !q||(c.name+' '+(c.description||'')).toLowerCase().indexOf(q)>=0;});
    if(!f.length) return '<div class="empty">검색 결과 없음</div>';
    return '<div class="cards">'+f.map(itemCard).join('')+'</div>';
  }

  function tokensView(){
    var T=DS.tokens, h='';
    function colorSec(title,arr){
      return '<div class="tok-sec"><h3>'+title+' · '+arr.length+'</h3><div class="tokgrid">'+arr.map(function(t){
        return '<div class="tokrow"><span class="sw" style="background:'+t.value+'"></span><div><div class="tn">'+esc(t.name)+'</div><div class="tv">'+esc(t.value)+'</div></div>'+(t.references?'<span class="ref">→ '+esc(t.references)+'</span>':(t.usedBy?'<span class="ref">'+esc(t.usedBy)+'</span>':''))+'</div>';
      }).join('')+'</div></div>';
    }
    h+='<div class="page-h"><h1>Tokens · 변수 관리</h1><p>모든 색·간격·타이포는 CSS 커스텀 프로퍼티(변수)로 관리됩니다. reference → semantic → component 3단계로, 컴포넌트는 component 토큰만 참조합니다.</p></div>';
    h+=colorSec('Reference (원시값)',T.reference);
    h+=colorSec('Semantic (의도)',T.semantic);
    h+=colorSec('Component (컴포넌트 전용)',T.component);
    // space
    h+='<div class="tok-sec"><h3>Space · '+T.space.length+'</h3><div class="tokgrid">'+T.space.map(function(t){var px=parseInt(t.value);return '<div class="tokrow scalerow"><div style="flex:1"><div class="tn">'+esc(t.name)+'</div><div class="bar" style="width:'+Math.min(px*3,160)+'px;margin-top:6px"></div></div><span class="ref">'+esc(t.value)+'</span></div>';}).join('')+'</div></div>';
    // radius
    h+='<div class="tok-sec"><h3>Radius · '+T.radius.length+'</h3><div class="tokgrid">'+T.radius.map(function(t){return '<div class="tokrow"><span class="sw" style="border-radius:'+t.value+';background:var(--raised)"></span><div><div class="tn">'+esc(t.name)+'</div><div class="tv">'+esc(t.value)+'</div></div></div>';}).join('')+'</div></div>';
    // type
    h+='<div class="tok-sec"><h3>Type · '+T.type.length+'</h3><div class="tokgrid">'+T.type.map(function(t){var p=t.value.split(' ');var fw=p[0],fs=(p[1]||'').split('/')[0];return '<div class="tokrow"><div style="flex:1"><div style="font-weight:'+fw+';font-size:'+fs+';letter-spacing:-.01em">'+esc(t.sample||'Aa')+'</div><div class="tv" style="margin-top:4px">'+esc(t.name)+' · '+esc(t.value)+'</div></div></div>';}).join('')+'</div></div>';
    return h;
  }

  function overview(){
    return '<div class="page-h"><h1>Design System Console</h1><p>실무자가 컴포넌트를 구성하는 아이콘·토큰(변수)·원자·컴포넌트를 한곳에서 확인하는 관리자 화면입니다. 성장 루프: 원자를 구분하고 → 합쳐 컴포넌트를 완성하고 → 토큰(변수)으로 스타일을 관리하고 → 컴포넌트를 모아 화면을 구성합니다.</p></div>'+
      '<div class="stats"><div class="stat"><div class="n">'+DS.atoms.length+'</div><div class="l">Atoms · 원자</div></div><div class="stat"><div class="n">'+DS.components.length+'</div><div class="l">Components</div></div><div class="stat"><div class="n">'+tokCount+'</div><div class="l">Tokens · 변수</div></div><div class="stat"><div class="n">'+DS.icons.length+'</div><div class="l">Icons</div></div></div>'+
      '<div class="loop"><div class="lnode"><div class="t">① Atom</div><div class="d">아이템(원자) 구분</div></div><div class="lnode"><div class="t">② Component</div><div class="d">원자를 슬롯으로 합쳐 완성</div></div><div class="lnode"><div class="t">③ Token</div><div class="d">토큰=변수로 스타일 관리</div></div><div class="lnode"><div class="t">④ Screen</div><div class="d">컴포넌트를 모아 화면 구성</div></div></div>';
  }

  function iconsView(){
    return '<div class="page-h"><h1>Icons</h1><p>컴포넌트가 사용하는 아이콘 세트입니다.</p></div><div class="iconset">'+DS.icons.map(function(i){return '<div class="ico">'+svg(i.path)+'<div class="in">'+esc(i.name)+'</div></div>';}).join('')+'</div>';
  }

  function render(v){
    if(v==='overview') main.innerHTML=overview();
    else if(v==='tokens') main.innerHTML=tokensView();
    else if(v==='icons') main.innerHTML=iconsView();
    else if(v==='atoms') main.innerHTML='<div class="page-h"><h1>Atoms · 원자</h1><p>더 쪼갤 수 없는 UI 단위. 카드를 눌러 variants·states·slots·토큰·접근성을 확인하세요.</p></div>'+grid(DS.atoms);
    else if(v==='components') main.innerHTML='<div class="page-h"><h1>Components</h1><p>원자를 슬롯으로 조합한 컴포넌트. 카드를 눌러 상세 스펙을 확인하세요.</p></div>'+grid(DS.components);
  }

  function drawer(name){
    var c=byName[name]; if(!c) return;
    var d=document.getElementById('drawer');
    var h='<div class="dh"><span class="lvl '+c.atomicLevel+'">'+c.atomicLevel+'</span><h2 style="font-size:18px">'+esc(c.name)+'</h2><button class="x" id="dx">×</button></div><div class="db">';
    if(c.family) h+='<div class="mono" style="color:var(--muted);font-size:12px">family: '+esc(c.family)+'</div>';
    h+='<p class="desc">'+esc(c.description||'')+'</p>';
    if(c.slots&&c.slots.length){h+='<div class="blk"><div class="bt">Slots</div><div class="kv">'+c.slots.map(function(s){return '<div class="slotline"><span class="s">#'+esc(s.name)+'</span><span class="a">'+esc(s.accepts||'')+'</span>'+(s.optional?'<span class="opt">optional</span>':'')+(s.repeatable?'<span class="opt">repeat</span>':'')+'</div>';}).join('')+'</div></div>';}
    if(c.variants&&c.variants.length){h+='<div class="blk"><div class="bt">Variants (변형 축)</div><div class="kv">'+c.variants.map(function(v){return '<div class="axis"><span class="an">'+esc(v.axis)+'</span><div class="vals">'+v.values.map(function(x){return '<span class="val'+(x===v.default?' def':'')+'">'+esc(x)+(x===v.default?' ★':'')+'</span>';}).join('')+'</div></div>';}).join('')+'</div></div>';}
    if(c.states&&c.states.length){h+='<div class="blk"><div class="bt">States</div><div class="vals">'+c.states.map(function(s){return '<span class="pill">'+esc(s)+'</span>';}).join('')+'</div></div>';}
    if(c.tokens&&c.tokens.length){h+='<div class="blk"><div class="bt">Tokens (변수)</div><div class="kv">'+c.tokens.map(function(t){return '<div class="slotline"><span class="s mono" style="color:var(--brand)">'+esc(t.name)+'</span>'+(t.references?'<span class="a">→ '+esc(t.references)+'</span>':'')+'</div>';}).join('')+'</div></div>';}
    if(c.children&&c.children.length){h+='<div class="blk"><div class="bt">Children</div><div class="vals">'+c.children.map(function(x){return '<span class="val" data-open="'+esc(x)+'">'+esc(x)+'</span>';}).join('')+'</div></div>';}
    if(c.accessibility&&c.accessibility.length){h+='<div class="blk"><div class="bt">Accessibility</div><ul class="a11y" style="margin:0;padding-left:18px">'+c.accessibility.map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul></div>';}
    if(c.consolidates&&c.consolidates.length){h+='<div class="blk"><div class="bt">Consolidates (통합한 as-is)</div><div class="vals">'+c.consolidates.map(function(x){return '<span class="pill">'+esc(x)+'</span>';}).join('')+'</div></div>';}
    h+='</div>';
    d.innerHTML=h; d.classList.add('on'); d.setAttribute('aria-hidden','false'); document.getElementById('scrim').classList.add('on');
    document.getElementById('dx').onclick=closeDrawer;
  }
  function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('scrim').classList.remove('on');}

  // events
  document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b)return;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.remove('on');});b.classList.add('on');render(b.dataset.v);});
  main.addEventListener('click',function(e){var el=e.target.closest('[data-open]');if(el)drawer(el.getAttribute('data-open'));});
  document.addEventListener('click',function(e){var el=e.target.closest('.drawer [data-open]');if(el){drawer(el.getAttribute('data-open'));}});
  document.getElementById('scrim').addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});
  document.getElementById('q').addEventListener('input',function(e){q=e.target.value.toLowerCase().trim();var on=document.querySelector('nav.side button.on').dataset.v;if(on==='atoms'||on==='components')render(on);else{document.querySelector('nav.side [data-v=atoms]').click();}});
  var root=document.documentElement;
  document.getElementById('themeBtn').addEventListener('click',function(){var c=root.getAttribute('data-theme');if(!c){c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}root.setAttribute('data-theme',c==='dark'?'light':'dark');});

  render('overview');
})();
</script>
</body>
</html>
